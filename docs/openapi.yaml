          minimum: 1
        pageSize:
          type: integer
          minimum: 10
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    VacancyPage:
      type: object
      additionalProperties: false
