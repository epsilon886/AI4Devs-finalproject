      properties:
        vacancies:
          type: array
          items:
            $ref: '#/components/schemas/VacancySummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 10
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [applications, page, pageSize, totalItems, totalPages]
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 10
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PersonFirstName:
      type: string
      minLength: 1
      maxLength: 100
      description: Se recorta en los extremos y debe conservar al menos un carácter tras el recorte.
    PersonLastName:
      type: string
      minLength: 1
      maxLength: 100
      description: Se recorta en los extremos y debe conservar al menos un carácter tras el recorte.
    Email:
      type: string
      format: email
      maxLength: 200
      description: Se recorta y convierte a minúsculas antes de validar, almacenar, buscar y comparar.
    Password:
      type: string
      minLength: 15
      maxLength: 128
      description: Se valida exactamente como llega, sin trim, lowercase ni otra normalización.
    Phone:
      type: [string, 'null']
      maxLength: 30
      pattern: '^(?:[0-9]{6,30}|\+[0-9]{6,29})$'
      description: Si es string, se recorta en los extremos; debe contener + opcional solo al inicio y entre 6 dígitos y 30 caracteres totales, sin espacios internos, paréntesis ni guiones.
    PipelineName:
      type: string
      minLength: 1
      maxLength: 100
      description: Se normaliza con trim, primera letra en mayúscula y resto en minúscula antes de validar y persistir.
    PipelineStageName:
      type: string
      minLength: 1
      maxLength: 100
      description: Se normaliza con trim, primera letra en mayúscula y resto en minúscula antes de validar y persistir.
    VacancyTitle:
      type: string
      minLength: 1
      maxLength: 200
      description: Se recorta en los extremos y debe conservar al menos un carácter tras el recorte.
    CompanyName:
      type: string
      minLength: 1
      maxLength: 200
      description: Se recorta en los extremos y debe conservar al menos un carácter tras el recorte.
    VacancyDescription:
      type: string
      minLength: 1
      maxLength: 1500
      description: Se recorta solo en los extremos, debe conservar al menos un carácter y preserva whitespace y saltos de línea internos.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [statusCode, code, message]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [statusCode, code, message, errors]
      properties:
        statusCode:
          type: integer
          const: 400
        code:
          type: string
          const: VALIDATION_ERROR
        message:
          type: string
          const: Invalid request data
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
                description: Usa dot notation con índice para campos anidados, por ejemplo `stages.1.position`; los errores globales usan `body`.
              message:
                type: string
  responses:
    ValidationError:
      description: '`VALIDATION_ERROR` — Invalid request data.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthorized:
      description: '`UNAUTHORIZED` — Authentication required.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 401, code: UNAUTHORIZED, message: Authentication required }
    InvalidCredentials:
      description: '`INVALID_CREDENTIALS` — Invalid email or password.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 401, code: INVALID_CREDENTIALS, message: Invalid email or password }
    UnauthorizedRequest:
      description: '`UNAUTHORIZED_REQUEST` — Request could not be verified.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 403, code: UNAUTHORIZED_REQUEST, message: Request could not be verified }
    RegistrationConflict:
      description: '`REGISTRATION_CONFLICT` — Unable to create account with the provided information.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 409, code: REGISTRATION_CONFLICT, message: Unable to create account with the provided information }
    RateLimitExceeded:
      description: '`RATE_LIMIT_EXCEEDED` — Too many requests. Please try again later.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 429, code: RATE_LIMIT_EXCEEDED, message: Too many requests. Please try again later. }
    UnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE` — Content type is not supported.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 415, code: UNSUPPORTED_MEDIA_TYPE, message: Content type is not supported }
    InternalServerError:
      description: '`INTERNAL_SERVER_ERROR` — An unexpected error occurred.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 500, code: INTERNAL_SERVER_ERROR, message: An unexpected error occurred }
    CandidateNotFound:
      description: '`CANDIDATE_NOT_FOUND` — Candidate not found.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 404, code: CANDIDATE_NOT_FOUND, message: Candidate not found }
    CandidateEmailConflict:
      description: '`CANDIDATE_EMAIL_CONFLICT` — A candidate with this email already exists.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 409, code: CANDIDATE_EMAIL_CONFLICT, message: A candidate with this email already exists }
    PipelineNotFound:
      description: '`PIPELINE_NOT_FOUND` — Pipeline not found.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 404, code: PIPELINE_NOT_FOUND, message: Pipeline not found }
    PipelineNotEditable:
      description: '`PIPELINE_NOT_EDITABLE` — This pipeline can no longer be modified.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 409, code: PIPELINE_NOT_EDITABLE, message: This pipeline can no longer be modified }
    PipelineNameConflict:
      description: '`PIPELINE_NAME_CONFLICT` — A pipeline with this name already exists.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 409, code: PIPELINE_NAME_CONFLICT, message: A pipeline with this name already exists }
    VacancyNotFound:
      description: '`VACANCY_NOT_FOUND` — Vacancy not found.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 404, code: VACANCY_NOT_FOUND, message: Vacancy not found }
    VacancyNotOpen:
      description: '`VACANCY_NOT_OPEN` — The vacancy does not allow this operation.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 409, code: VACANCY_NOT_OPEN, message: The vacancy does not allow this operation }
    ApplicationNotFound:
      description: '`APPLICATION_NOT_FOUND` — Application not found.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { statusCode: 404, code: APPLICATION_NOT_FOUND, message: Application not found }
